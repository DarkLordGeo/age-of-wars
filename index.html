<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age of Wars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Age 1 HUD: carved wood, stretched hide and rope lashing (original styling). */
      :root {
        --wood-1: #5a3d24; --wood-2: #3b2716; --wood-3: #24170c; --wood-hi: #8a6440;
        --hide-1: #d8c095; --hide-2: #b99868; --ink: #2a1a0c;
        --rope: #b49a66; --gold: #f0c14b; --gold-dk: #9a6a14;
        --blue: #3d7be0; --red: #d8473a; --text: #f6ead2;
        --display: 'IM Fell English SC', Georgia, serif;
        --ui: 'Alegreya Sans', system-ui, sans-serif;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: var(--ui); }
      #app { position: fixed; inset: 0; }
      #hud { position: fixed; inset: 0; pointer-events: none; color: var(--text); text-shadow: 0 1px 2px rgba(0,0,0,.8); }
      #hud button { pointer-events: auto; }

      /* shared surfaces */
      .wood {
        background:
          repeating-linear-gradient(92deg, rgba(255,255,255,.035) 0 2px, transparent 2px 9px),
          repeating-linear-gradient(88deg, rgba(0,0,0,.12) 0 1px, transparent 1px 13px),
          linear-gradient(180deg, var(--wood-1), var(--wood-2) 60%, var(--wood-3));
        border: 2px solid #1a0f06;
        box-shadow: inset 0 1px 0 rgba(255,220,170,.25), inset 0 -2px 0 rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.55);
        border-radius: 6px;
      }
      .lashed { position: relative; }
      .lashed::before, .lashed::after {
        content: ''; position: absolute; top: -5px; width: 9px; bottom: -5px;
        background: repeating-linear-gradient(180deg, var(--rope) 0 3px, #6f5a36 3px 5px);
        border-radius: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.6);
      }
      .lashed::before { left: 14px; } .lashed::after { right: 14px; }

      /* ---- in-game HUD (classic layout) ---- */
      .plank {
        position: fixed; top: 0;
        background:
          repeating-linear-gradient(180deg, rgba(0,0,0,.08) 0 1px, transparent 1px 11px),
          repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 23px),
          linear-gradient(180deg, #d9b47a, #b88a4e 70%, #9a6f3a);
        border: 3px solid #4a2c12; border-top: 0; color: var(--ink); text-shadow: 0 1px 0 rgba(255,235,200,.5);
        box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), 0 4px 10px rgba(0,0,0,.45);
      }
      .plank::after { /* nailed corner */
        content: ''; position: absolute; bottom: 6px; width: 9px; height: 9px; border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #d6d0c4, #5d5a54); box-shadow: 0 1px 2px rgba(0,0,0,.6);
      }
      .purse { left: 18px; width: 230px; padding: 10px 16px 14px; border-radius: 0 0 8px 8px; }
      .purse::after { right: 8px; }
      .purse .gold { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 26px; color: #5a3b06; }
      .purse .gold .coin { width: 22px; height: 22px; }
      .purse .exp { font-weight: 800; font-size: 19px; margin-top: 2px; }
      .purse .exp b { color: #b0201a; }
      .purse .exp small { font-size: 13px; opacity: .75; }
      .purse .age { font-family: var(--display); font-size: 14px; opacity: .85; margin-top: 2px; }
      .coin { display: inline-block; width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b8, var(--gold) 45%, var(--gold-dk)); box-shadow: 0 0 0 1px #5a3a08, 0 1px 2px rgba(0,0,0,.6); }

      .train { position: fixed; top: 12px; left: 268px; right: 470px; display: flex; gap: 8px; align-items: center; }
      .trainbar { position: relative; flex: 1; height: 18px; border: 2px solid #18324f; background: rgba(10,25,45,.55); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
      .trainbar > div { height: 100%; width: 0; background: linear-gradient(180deg, #8fd0ff, #2f86d6); transition: width .1s linear; }
      .trainbar span { position: absolute; inset: 0; font-size: 12px; font-weight: 800; line-height: 18px; text-align: center; color: #fff; text-shadow: 0 1px 2px #000; }
      .squares { display: flex; gap: 4px; }
      .sq { position: relative; width: 24px; height: 24px; border: 2px solid #18324f; background: rgba(10,25,45,.45); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); pointer-events: auto; overflow: hidden; }
      .sq.filled { background: #2c3e57; cursor: pointer; border-color: #f0c14b; }
      .sq img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .sq.filled:hover::after { content: '×'; position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; color: #fff; background: rgba(150,20,10,.6); }

      .menu-plank { right: 18px; width: 420px; padding: 6px 14px 26px; border-radius: 0 0 8px 8px; }
      .menu-plank::after { left: 8px; }
      .menu-title { font-family: var(--display); font-size: 22px; color: #f7d23b; text-shadow: 0 2px 0 #5a3204, 0 0 6px rgba(0,0,0,.4); margin: 0 0 4px 4px; }
      .menu-row { display: flex; gap: 9px; flex-wrap: wrap; }
      .menu-row[hidden] { display: none; }
      .ibtn {
        position: relative; width: 62px; height: 62px; padding: 6px; cursor: pointer; color: #1c1c1c;
        background: linear-gradient(180deg, #a9b3bd, #7f8a95); border: 3px solid #e6b422; border-radius: 3px;
        box-shadow: inset 0 0 0 2px #5b4410, 0 2px 4px rgba(0,0,0,.5);
      }
      .ibtn::before, .ibtn::after { /* rivets */
        content: ''; position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #c4271c; box-shadow: 0 0 0 1px #5a0e08;
      }
      .ibtn::before { left: -4px; top: -4px; box-shadow: 0 0 0 1px #5a0e08, 58px 0 0 0 #c4271c, 0 58px 0 0 #c4271c, 58px 58px 0 0 #c4271c; }
      .ibtn::after { display: none; }
      .ibtn svg { width: 100%; height: 100%; }
      .ibtn:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
      .ibtn:disabled { cursor: not-allowed; filter: grayscale(.6) brightness(.75); }
      .ibtn[data-id="evolve"] { color: #f2c81a; }
      .ibtn[data-id="evolve"]:not(:disabled) { animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 50% { box-shadow: inset 0 0 0 2px #5b4410, 0 0 14px 3px rgba(242,200,26,.8); } }
      .ibtn.back { color: #3b2208; }
      .ibtn.unit { padding: 0; overflow: hidden; background: radial-gradient(circle at 50% 35%, #7d9cbc, #2c3e57 80%); }
      .ibtn.unit img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .ibtn.unit .glyph { font-family: var(--display); font-size: 28px; color: rgba(255,255,255,.6); }
      .ibtn .hk { position: absolute; left: 2px; top: 1px; font-size: 11px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px #000; }
      .ibtn .lock { display: none; position: absolute; inset: 0; place-items: center; font-size: 22px; background: rgba(15,10,6,.55); }
      .ibtn.locked .lock { display: grid; }
      .ibtn.locked img { filter: grayscale(1); }
      .ibtn.poor { box-shadow: inset 0 0 0 2px #7a1208, 0 2px 4px rgba(0,0,0,.5); }
      .ibtn.upgrade { color: #3a2a1a; }
      .ibtn .owned { display: none; position: absolute; right: 2px; bottom: 0; font-weight: 800; color: #1d7a1d; text-shadow: 0 0 3px #fff; }
      .ibtn.owned .owned { display: block; }
      .tip { position: absolute; left: 14px; right: 14px; bottom: 5px; font-size: 13px; font-weight: 800; color: #3b2208; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .hpbar { position: fixed; top: 34%; width: 22px; height: 36%; border: 2px solid #1a0f06; background: rgba(20,8,6,.55); box-shadow: 0 2px 8px rgba(0,0,0,.5); }
      .hpbar.player { left: 14px; } .hpbar.enemy { right: 14px; }
      .hpbar .fill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, #e4483b, #b5170f); transition: height .15s linear; }
      .hpbar span { position: absolute; top: -2px; font-weight: 800; font-size: 18px; color: #c4271c; text-shadow: 0 1px 2px rgba(0,0,0,.6), 0 0 2px #fff; }
      .hpbar.player span { left: 30px; } .hpbar.enemy span { right: 30px; }
      .toast { position: fixed; top: 150px; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: 20px; color: #ffd36b; }

      /* buttons + side panels */
      .btn {
        font: inherit; font-weight: 700; font-size: 14px; padding: 8px 14px; color: var(--text); cursor: pointer;
        background: linear-gradient(180deg, #7a5532, #4d321c); border: 2px solid #1a0f06; border-radius: 5px;
        box-shadow: inset 0 1px 0 rgba(255,220,170,.3), 0 2px 4px rgba(0,0,0,.5);
      }
      .btn:hover:not(:disabled) { background: linear-gradient(180deg, #8d6440, #5a3b22); }
      .btn.small { font-size: 13px; padding: 5px 10px; }
      .btn:disabled { opacity: .5; cursor: not-allowed; }
      .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background: rgba(0,0,0,.55); pointer-events: auto; }
      .overlay.show { display: flex; }
      .overlay h1 { font-family: var(--display); font-size: 64px; margin: 0; color: #ffe7b0; }
      .hint { font-size: 12px; opacity: .85; }
      /* hidden HUD while a menu is open */
      #hud.hidden { display: none; }
      .overlay-actions { display: flex; gap: 12px; }

      /* main / pause menu: framed wood panel over the blurred live battle */
      .menu {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10;
        backdrop-filter: blur(7px) saturate(1.05); -webkit-backdrop-filter: blur(7px) saturate(1.05);
        background: radial-gradient(ellipse at center, rgba(10,6,2,.15) 0%, rgba(10,6,2,.55) 75%, rgba(5,3,1,.8) 100%);
        color: var(--text); text-shadow: 0 1px 2px rgba(0,0,0,.8); font-family: var(--ui);
      }
      .menu.show { display: flex; animation: menu-in .35s ease-out; }
      @keyframes menu-in { from { opacity: 0; } to { opacity: 1; } }
      .menu-panel { position: relative; width: min(460px, 90vw); padding: 26px 52px 28px; text-align: center; }
      .menu-panel::before, .menu-panel::after {
        content: ''; position: absolute; top: -10px; bottom: -10px; width: 12px; border-radius: 4px;
        background: repeating-linear-gradient(180deg, var(--rope) 0 4px, #6f5a36 4px 7px); box-shadow: 0 2px 5px rgba(0,0,0,.6);
      }
      .menu-panel::before { left: 22px; } .menu-panel::after { right: 22px; }
      .title { display: flex; flex-direction: column; align-items: center; margin-bottom: 18px; }
      .title .t1 { font-family: var(--display); font-size: 52px; line-height: 1; color: #ffe2a0; letter-spacing: .02em;
        text-shadow: 0 2px 0 #4a2a10, 0 4px 10px rgba(0,0,0,.7); }
      .title .t2 { font-family: var(--display); font-size: 18px; color: #d9c49a; margin-top: 6px; letter-spacing: .12em; }
      .title.small .t1 { font-size: 34px; }
      .mlist { display: flex; flex-direction: column; gap: 9px; align-items: stretch; }
      .mbtn {
        font: inherit; font-family: var(--display); font-size: 20px; color: var(--ink); text-shadow: 0 1px 0 rgba(255,240,210,.6);
        padding: 9px 16px; cursor: pointer; border-radius: 6px; border: 2px solid #2a1a0c;
        background: linear-gradient(180deg, var(--hide-1), var(--hide-2));
        box-shadow: inset 0 0 0 2px rgba(255,240,210,.35), 0 3px 6px rgba(0,0,0,.5);
        transition: transform .08s ease, filter .08s ease;
      }
      .mbtn:hover, .mbtn:focus-visible { transform: translateX(3px); filter: brightness(1.08); outline: none; }
      .mbtn.big { font-size: 26px; padding: 12px 16px; background: linear-gradient(180deg, #f0d49c, #c89a5a); }
      .mbtn.ghost { background: transparent; color: var(--text); border-color: rgba(216,192,149,.5); box-shadow: none; text-shadow: 0 1px 2px rgba(0,0,0,.8); font-size: 17px; }
      .mbtn.choice { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 1px; }
      .mbtn.choice b { font-weight: 400; font-size: 21px; }
      .mbtn.choice small { font-family: var(--ui); font-size: 13px; font-weight: 700; opacity: .8; }
      .mbtn.choice.on { box-shadow: inset 0 0 0 3px #7a4a14, 0 0 0 2px var(--gold), 0 3px 6px rgba(0,0,0,.5); }
      .mbtn.choice.on b::after { content: '  ✓'; }
      .mtext { text-align: left; font-size: 15px; line-height: 1.45; margin-bottom: 14px; }
      .mtext p { margin: 0 0 8px; }
      .mtext p.label { font-family: var(--display); font-size: 17px; color: #ffe7b0; margin: 0; }
      .mtext ul { margin: 0; padding-left: 18px; }
      .mtext li { margin-bottom: 5px; }
      .vols { display: flex; flex-direction: column; gap: 8px; }
      .vol { display: grid; grid-template-columns: 120px 1fr 44px; align-items: center; gap: 10px; font-family: var(--display); font-size: 17px; color: #ffe7b0; }
      .vol input { accent-color: #e6b422; width: 100%; }
      .vol output { font-family: var(--ui); font-weight: 800; font-size: 13px; text-align: right; }
      kbd { font-family: var(--ui); font-weight: 800; font-size: 12px; padding: 1px 6px; border-radius: 4px; color: var(--ink); text-shadow: none; background: var(--hide-1); border: 1px solid var(--ink); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
