<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age of Wars</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 3px #000; }
      #hud button { pointer-events: auto; }
      .hud-top { display: flex; justify-content: space-between; gap: 24px; padding: 14px 20px; }
      .hud-base { width: 300px; }
      .hud-base.enemy { text-align: right; }
      .hud-label { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
      .bar { height: 16px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35); border-radius: 3px; overflow: hidden; }
      .bar > div { height: 100%; transition: width .12s linear; }
      .hud-base.player .bar > div { background: #3b82f6; }
      .hud-base.enemy .bar > div { background: #ef4444; margin-left: auto; }
      .hud-center { text-align: center; font-size: 14px; line-height: 1.5; }
      .hud-center .age { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .dim { opacity: .75; font-size: 12px; }
      .toast { position: fixed; top: 92px; left: 0; right: 0; text-align: center; font-size: 14px; color: #ffd36b; }
      .hud-bottom { position: fixed; left: 0; right: 0; bottom: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .units { display: flex; gap: 10px; }
      .queue { display: flex; gap: 6px; }
      .slot { position: relative; width: 78px; height: 26px; border: 1px dashed rgba(255,255,255,.35); border-radius: 4px; overflow: hidden; font-size: 12px; line-height: 26px; text-align: center; pointer-events: auto; }
      .slot.filled { border-style: solid; background: rgba(20,40,80,.6); cursor: pointer; }
      .slot span { position: relative; z-index: 1; }
      .slot i { position: absolute; left: 0; bottom: 0; height: 100%; width: 0; background: rgba(59,130,246,.55); }
      .btn { font: inherit; font-size: 14px; padding: 9px 14px; color: #fff; background: #1f3a68; border: 1px solid #6b8fd0; border-radius: 6px; cursor: pointer; }
      .btn.small { font-size: 12px; padding: 6px 10px; }
      .btn:disabled { opacity: .45; cursor: not-allowed; }
      .panel { position: fixed; display: flex; flex-direction: column; gap: 6px; }
      .panel.right { right: 16px; top: 96px; width: 260px; }
      .panel.right .upgrade { text-align: left; }
      .panel.left { left: 16px; bottom: 16px; align-items: flex-start; }
      .panel-title { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; margin-top: 6px; }
      .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background: rgba(0,0,0,.55); pointer-events: auto; }
      .overlay.show { display: flex; }
      .overlay h1 { font-size: 56px; margin: 0; }
      .hint { font-size: 12px; opacity: .8; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
