name: Bug report
description: Something in the game is broken or behaves wrongly.
labels: [bug]
projects: [DarkLordGeo/2]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://age-of-wars.vercel.app (or `npm run dev`)
        2. Start a match on Normal
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS and GPU
      placeholder: Chrome 140, Windows 11, RTX 3050
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Live site
        - Local dev server
        - Local production build
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Copy from the browser dev tools console (F12), if any.
      render: text
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Drag files here. Very useful for visual bugs.
